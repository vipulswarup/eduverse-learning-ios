<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Friendly blue and white, light and dark. Nunito for a rounded, playful feel. */
  --paper:#F3F8FF; --panel:#FFFFFF; --raise:#EAF3FF; --ink:#12284F; --muted:#5A6C8F; --line:#D7E4F8; --line2:#B9CDEE;
  --a1:#1D74F5; --a2:#12B5E6; --on-a:#FFFFFF; --a1t:color-mix(in srgb,var(--a1) 72%,#000);
  --star:#FFB703; --ok:#16A34A; --danger:#E5484D;
  --shadow:none; --glow:none; --grad:var(--a1);
  --stars:none; --stars-size:26px 26px;
  --display:"Nunito","Segoe UI",system-ui,sans-serif;
  --serif:var(--display);
  --sans:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-accent="blue"]{--a1:#1D74F5;--on-a:#FFFFFF}
:root[data-accent="solar"]{--a1:#F59E0B;--on-a:#3A2300}
:root[data-accent="ion"]{--a1:#0EA5C6;--on-a:#052A33}
:root[data-accent="nova"]{--a1:#E8457A;--on-a:#FFFFFF}
:root[data-accent="aurora"]{--a1:#16A34A;--on-a:#FFFFFF}
:root[data-accent="cosmos"]{--a1:#7C5CFA;--on-a:#FFFFFF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --paper:#0D1B38; --panel:#142650; --raise:#1A3263; --ink:#F1F6FF; --muted:#A5B6DA; --line:#24407A; --line2:#3558A3;
  --a1:#4D9BFF; --on-a:#06173A; --a1t:color-mix(in srgb,var(--a1) 78%,#fff); --ok:#4ADE80; --danger:#FF7A80; --star:#FFC933; --stars:none;
  color-scheme:dark;
  }
:root[data-accent="blue"]:not([data-theme="light"]){--a1:#4D9BFF;--on-a:#06173A}
:root[data-accent="solar"]:not([data-theme="light"]){--a1:#FFC933;--on-a:#06173A}
:root[data-accent="ion"]:not([data-theme="light"]){--a1:#3CD4E8;--on-a:#06173A}
:root[data-accent="nova"]:not([data-theme="light"]){--a1:#FF7AA3;--on-a:#06173A}
:root[data-accent="aurora"]:not([data-theme="light"]){--a1:#4ADE80;--on-a:#06173A}
:root[data-accent="cosmos"]:not([data-theme="light"]){--a1:#A592FF;--on-a:#06173A}
}
:root[data-theme="dark"]{
  --paper:#0D1B38; --panel:#142650; --raise:#1A3263; --ink:#F1F6FF; --muted:#A5B6DA; --line:#24407A; --line2:#3558A3;
  --a1:#4D9BFF; --on-a:#06173A; --a1t:color-mix(in srgb,var(--a1) 78%,#fff); --ok:#4ADE80; --danger:#FF7A80; --star:#FFC933; --stars:none;
  color-scheme:dark;
}
:root[data-theme="dark"][data-accent="blue"]{--a1:#4D9BFF;--on-a:#06173A}
:root[data-theme="dark"][data-accent="solar"]{--a1:#FFC933;--on-a:#06173A}
:root[data-theme="dark"][data-accent="ion"]{--a1:#3CD4E8;--on-a:#06173A}
:root[data-theme="dark"][data-accent="nova"]{--a1:#FF7AA3;--on-a:#06173A}
:root[data-theme="dark"][data-accent="aurora"]{--a1:#4ADE80;--on-a:#06173A}
:root[data-theme="dark"][data-accent="cosmos"]{--a1:#A592FF;--on-a:#06173A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--stars);background-size:var(--stars-size)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.wrap{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-bottom:2rem}
.brand{font-family:var(--serif);font-size:1.4rem;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.mark{width:32px;height:32px;border-radius:8px;display:block;background:#05081c}
.logo{display:block;width:min(100%,300px);height:auto;aspect-ratio:560/398;border-radius:22px;background:#05081c;margin:0 0 1.25rem}
.link{background:none;border:0;padding:.25rem 0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;margin:0}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:-.01em;margin-bottom:.75rem}
.hero p{color:var(--muted);max-width:34rem;margin:0 0 1.75rem}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:.6rem;box-shadow:var(--shadow)}
.ask input{border:0;background:transparent;padding:.85rem .75rem;font-size:1.15rem}
.ask input:focus{outline:none}
.ask:focus-within{border-color:var(--a1);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--a1) 22%,transparent)}
.ask input[type=text],.ask input:not([type]){width:100%}
.ask-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.25rem .25rem 0}
.levels{display:flex;gap:.25rem;flex-wrap:wrap}
.levels label{cursor:pointer;position:relative}
.levels input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.levels span{display:inline-block;padding:.4rem .85rem;border-radius:999px;font-size:.92rem;color:var(--muted);transition:background .15s}
.levels label:hover span{color:var(--ink)}
.levels input:checked+span{background:var(--grad);color:#fff}
.levels input:focus-visible+span{outline:2px solid var(--star)}
.btn{border:0;border-radius:12px;padding:.75rem 1.3rem;background:var(--grad);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--a2) 70%,transparent)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.ideas{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.25rem 0 0}
.ideas button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;color:var(--muted);cursor:pointer;font-size:.95rem}
.ideas button:hover{color:var(--ink);border-color:var(--a1)}
.section{margin-top:3rem}
.section h2{font-size:1.35rem;margin-bottom:1rem}
.btn.danger{background:var(--danger);box-shadow:none}
.mini{flex:1 0 100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:.45rem}
.mini i{display:block;height:100%;background:var(--grad)}
.sky{width:100%;height:auto;display:block;margin:1.5rem 0 1rem;overflow:visible}
.sky line{stroke:color-mix(in srgb,var(--muted) 35%,transparent);stroke-width:1.5}
.sky line.lit{stroke:var(--star)}
.sky circle.halo{fill:var(--star);opacity:.18}
.sky .s{fill:var(--panel);stroke:var(--muted);stroke-width:2;cursor:pointer}
.sky .s.done{fill:var(--star);stroke:var(--star)}
.sky .s:hover,.sky .s:focus{stroke:var(--a1)}
.sky text{fill:var(--muted);font-family:var(--sans);font-size:13px}
.course-head h1{font-size:clamp(1.9rem,6vw,2.8rem);margin-bottom:.5rem}
.course-head p{color:var(--muted);margin:0}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.5rem 0 0}
.meter i{display:block;height:100%;background:var(--grad)}
ol.path{list-style:none;counter-reset:n;padding:0;margin:0}
ol.path li{counter-increment:n}
ol.path button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:1rem 0 1rem 2.75rem;position:relative;cursor:pointer}
ol.path button::before{content:counter(n);position:absolute;left:0;top:1rem;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.9rem;color:var(--muted)}
ol.path li.done button::before{content:"✓";background:var(--star);border-color:var(--star);color:#2a1d00;font-weight:700}
ol.path strong{display:block;font-family:var(--serif);font-weight:400;font-size:1.12rem}
ol.path span{color:var(--muted);font-size:.95rem}
.lesson-meta{color:var(--muted);font-size:.95rem;margin-bottom:.5rem}
.lesson h1{font-size:clamp(1.8rem,5.5vw,2.5rem);margin-bottom:1.5rem}
.prose{font-size:1.08rem;line-height:1.7}
.prose h2{font-size:1.4rem;margin:2rem 0 .6rem}
.prose h3{font-size:1.15rem;margin:1.5rem 0 .5rem}
.prose p{margin:0 0 1rem}
.prose ul,.prose ol{padding-left:1.4rem;margin:0 0 1rem}
.prose li{margin:.3rem 0}
.prose code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:.05rem .35rem;font-size:.92em}
.prose pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;overflow-x:auto;font-size:.92rem}
.prose pre code{border:0;padding:0;background:none}
.prose blockquote{margin:0 0 1rem;padding:.25rem 0 .25rem 1rem;border-left:3px solid var(--star);color:var(--muted)}
.wait{color:var(--muted);font-style:italic}
math{font-size:1.12em}
.prose math[display="block"]{display:block;margin:1rem 0;overflow-x:auto;overflow-y:hidden;max-width:100%}
.mathraw{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.25rem;margin-top:2rem;box-shadow:var(--shadow)}
.panel h2{font-size:1.25rem;margin-bottom:.75rem}
.q{margin:0 0 1.5rem}
.q p{margin:0 0 .6rem;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.6rem .85rem;margin:.35rem 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--a1)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--panel))}
.opt:disabled{cursor:default}
.why{font-size:.95rem;color:var(--muted);margin:.4rem 0 0}
.chat{display:flex;flex-direction:column;gap:.75rem;margin-bottom:.75rem}
.msg{padding:.6rem .85rem;border-radius:12px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.msg.ai p:last-child{margin-bottom:0}
.chat-form{display:flex;gap:.5rem}
.chat-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:.6rem .85rem}
.chat-form input:focus{outline:none;border-color:var(--a1)}
.nav-row{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
.note{border-left:3px solid var(--a1);padding:.6rem .9rem;background:var(--panel);margin:1rem 0;border-radius:0 12px 12px 0;box-shadow:var(--shadow)}
.empty{color:var(--muted)}
.tbl{overflow-x:auto;margin:0 0 1.25rem}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
.tbl th{background:var(--panel);font-family:var(--serif);font-weight:400}

.circ{margin:1.25rem 0;color:var(--ink);text-align:center}
.circ svg{width:100%;max-width:520px;height:auto;display:inline-block}
.circ .wire{stroke:var(--muted);transition:stroke .2s}
.circ.on .wire{stroke:var(--a1)}
.circ .glow{fill:var(--star);opacity:0;transition:opacity .25s}
.circ.on .glow{opacity:.9;filter:drop-shadow(0 0 8px var(--star))}
.circ .sw-closed{display:none}.circ.on .sw-open{display:none}.circ.on .sw-closed{display:inline}
.circ text.lbl{fill:var(--muted);font-size:13px;font-family:var(--sans)}
.circ text.pm{fill:var(--ink);font-size:16px;font-family:var(--sans);font-weight:700}
.circ-cap{color:var(--muted);font-size:.95rem;margin:.4rem 0 .8rem}
.circ-sym{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.75rem;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:1rem;box-shadow:var(--shadow)}
.circ-sym figure{margin:0}.circ-sym svg{max-width:100px;display:block;margin:0 auto}.circ-sym figcaption{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.gph{margin:1.25rem 0;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:.75rem;box-shadow:var(--shadow)}
.gph svg{width:100%;height:auto;display:block}
.gph text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.gph-leg{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.5rem .25rem .1rem;font-size:.92rem}
.gph-leg span::before{content:"";display:inline-block;width:.8rem;height:.25rem;border-radius:2px;background:var(--c);margin-right:.4rem;vertical-align:middle}
.frac{margin:1.25rem 0;display:grid;gap:.9rem}
.frac-row{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:.8rem .9rem;box-shadow:var(--shadow)}
.frac-row b{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.frac-row small{color:var(--muted);margin-left:.6rem}
.frac-bar{display:flex;gap:3px;margin-top:.55rem}
.frac-bar i{flex:1;height:2.1rem;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.frac-bar i.on{background:var(--grad);border-color:transparent}
.tl{list-style:none;margin:1.25rem 0;padding:0 0 0 1.4rem;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 1.1rem .4rem}
.tl li::before{content:"";position:absolute;left:-1.72rem;top:.35rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--star);border:2px solid var(--paper)}
.tl b{display:block;font-family:var(--serif);font-weight:400}
.tl span{color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:1.25rem 0}
.flow .fl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.55rem .85rem;box-shadow:var(--shadow);font-weight:700}
.flow .fa{font-style:normal;color:var(--a2);font-weight:700}
@media (max-width:520px){.flow{flex-direction:column;align-items:stretch}.flow .fa{text-align:center;transform:rotate(90deg)}}
.pno{margin:1.25rem 0;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:.9rem;box-shadow:var(--shadow);overflow-x:auto}
.pno-keys{position:relative;height:9rem;min-width:460px;display:flex;user-select:none}
.pk{flex:1;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:#fff;color:#1b2a4a;display:flex;align-items:flex-end;justify-content:center;font-size:.72rem;padding:0 0 .3rem;cursor:pointer;margin:0 1px}
.pk.on{background:linear-gradient(#cfe0ff,#9bb8ff)}
.pk.black{position:absolute;top:0;height:5.6rem;width:5%;background:#0e1530;color:#fff;margin:0;border-color:#0e1530;z-index:2;transform:translateX(-50%)}
.pk.black.on{background:linear-gradient(#5b7fff,#7352ff)}
.pk.playing{filter:brightness(.85)}
.pno-cap{margin:.6rem 0 0;color:var(--muted);font-size:.92rem}
.atomw{margin:1.25rem 0;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:.8rem;box-shadow:var(--shadow);text-align:center}
.atomw svg{width:100%;max-width:340px;height:auto}
.atomw text{fill:var(--ink);font-family:var(--sans)}
.atom-bar{display:flex;align-items:center;justify-content:center;gap:1rem}
.atom-bar b{font-family:var(--serif);font-weight:400;font-size:1.15rem;min-width:9rem}
.atom-sub{color:var(--muted);font-size:.92rem;margin:.2rem 0 0}
.pt-hint{display:none;margin:.5rem 0 0;font-size:.82rem;color:var(--muted)}
@media (max-width:720px){.pt-hint{display:block}}
.diagram{margin:1.25rem 0;text-align:center}
.diagram svg{width:100%;max-width:560px;height:auto;display:inline-block;overflow:visible}
.diagram text{fill:var(--ink);font-family:var(--sans);font-size:14px}
.f-a1{fill:var(--a1)}.f-a2{fill:var(--a2)}.f-star{fill:var(--star)}.f-ok{fill:var(--ok)}.f-soft{fill:var(--line)}.f-ink{fill:var(--ink)}.f-none{fill:none}.diagram text.f-white,.f-white{fill:#fff}
.s-a1{stroke:var(--a1)}.s-a2{stroke:var(--a2)}.s-star{stroke:var(--star)}.s-ink{stroke:var(--ink)}.s-muted{stroke:var(--muted)}.s-ok{stroke:var(--ok)}
.pt{margin:1.25rem 0;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:.9rem;box-shadow:var(--shadow);font-family:var(--sans)}
.pt-info{display:flex;gap:1rem;align-items:center;min-height:4.5rem;margin-bottom:.75rem}
.pt-big{width:4.2rem;height:4.2rem;flex:none;border-radius:14px;display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;border:2px solid var(--line)}
.pt-info b{display:block;font-family:var(--serif);font-weight:400;font-size:1.2rem}
.pt-info span{color:var(--muted);font-size:.92rem;line-height:1.4;display:block}
.pt-scroll{overflow-x:auto;padding-bottom:.25rem}
.pt-grid{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));grid-template-rows:repeat(7,auto) 10px repeat(2,auto);gap:3px;min-width:690px}
.pt-cell{aspect-ratio:1;border-radius:6px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1.1;background:var(--paper);color:var(--ink);transition:opacity .15s}
.pt-cell i{font-style:normal;font-size:.55rem;color:var(--muted)}
.pt-cell b{font-size:.92rem}
.pt-cell:hover,.pt-cell[aria-pressed="true"]{outline:2px solid var(--a1);outline-offset:1px}
.pt-ph{aspect-ratio:1;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;font-size:.55rem;color:var(--muted)}
.pt-legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.pt-chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .65rem;font-size:.8rem;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.pt-chip::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.pt-chip[aria-pressed="true"]{border-color:var(--a1)}
.pt.filtering .pt-cell:not(.on){opacity:.18}
.k-a{--c:#EF5B5B}.k-e{--c:#F2994A}.k-t{--c:#5B8DEF}.k-p{--c:#3FB8AF}.k-m{--c:#8FBF4D}.k-n{--c:#4CC38A}.k-h{--c:#B574F0}.k-g{--c:#D96FC4}.k-l{--c:#E9B93A}.k-c{--c:#B58B6A}
.pt-cell[class*="k-"]{background:color-mix(in srgb,var(--c) 30%,var(--panel));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.pt-big[class*="k-"]{background:color-mix(in srgb,var(--c) 30%,var(--panel));border-color:var(--c)}
.gate{max-width:26rem;margin:1rem auto 2rem;background:#05081c;color:#E6ECF5;border-radius:28px;padding:1.75rem 1.5rem 1.5rem;text-align:center}
.gate .logo{width:min(78%,260px);margin:0 auto 1rem;border-radius:0;background:none}
.gate h1{font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0 0 .5rem;color:#fff}
.gate .slogan{font-family:var(--serif);font-style:italic;color:#C9D4EC;font-size:1.05rem;margin:0 auto .6rem}
.slogan{color:var(--muted);font-style:italic;margin:.2rem 0 1rem}
.gate p{color:#A9B6D3;margin:0 auto 1.25rem;max-width:21rem;font-size:1rem}
.gate .avatar{width:44px;height:44px;border-radius:50%;margin:0 auto .75rem;display:block;background:#1b2447}
.gate .row{display:flex;flex-direction:column;gap:.6rem;align-items:stretch;max-width:20rem;margin:0 auto}
.gbtn{border:0;border-radius:12px;padding:.85rem 1.2rem;font-weight:700;cursor:pointer;color:#fff;text-decoration:none;text-align:center;display:block;background:linear-gradient(90deg,#2F8CFF,#7B5CFF)}
.gbtn.ghost{background:transparent;border:1px solid #33406b;color:#E6ECF5}
.gate .glink{background:none;border:0;color:#A9B6D3;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:.4rem}

/* feed */

@keyframes wlIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wl-logo{width:5.5rem;height:5.5rem;border-radius:24px}
.wl-age{width:100%;max-width:22rem;margin-top:1.2rem}.wl-age select{flex:1;min-width:0;font:inherit;padding:.75rem .8rem;border-radius:12px;border:2px solid var(--line2);background:var(--panel);color:var(--ink)}
.wl-ideas{justify-content:center;margin-top:1rem}
.wl-dots{display:flex;justify-content:center;gap:.45rem;margin:1rem 0}
.wl-dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line2)}.wl-dots i.on{width:1.5rem;border-radius:99px;background:var(--a1)}
.wl-next{width:100%}
.wl-next:disabled{opacity:.5}

/* accounts + friends */
.soc-lab{display:block;font-weight:700;font-size:.9rem;margin:.7rem 0 .3rem}
.rec-code{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;font-weight:800;letter-spacing:.08em;text-align:center;background:var(--raise);border-radius:14px;padding:.9rem;margin:.6rem 0 1rem;user-select:all}
.acct-btns{gap:.6rem}.acct-btns .btn{flex:1}
.btn.danger{background:#E5484D;border-color:#B4262B}
.g-social{display:flex}.g-social .g-soc{flex:1;min-width:0}
@media (max-width:420px){.g-social{grid-template-columns:1fr 1fr 1fr}.g-soc small{display:none}}
.fr-list{display:grid;gap:.45rem;margin:.6rem 0}
.fr-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fr-row span{display:flex;gap:.4rem}.fr-row .btn{padding:.45rem .8rem;min-height:0;font-size:.9rem}.fr-row em{font-style:normal;color:var(--muted);font-weight:700;font-size:.9rem}
.fr-st{color:var(--muted);font-weight:700}
.friends input#frQ{width:100%;margin-top:.8rem}

.wl-langs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;width:100%;max-width:24rem;margin-top:1.1rem}
.wl-lang{font:inherit;font-weight:800;padding:.8rem .6rem;border-radius:14px;border:2px solid var(--line2);border-bottom-width:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.wl-lang[aria-checked="true"]{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 16%,var(--panel));color:var(--a1t,var(--a1))}

  // ----- graphs -----
  const FN1 = {sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil};

  function renderHome(err){
    const hash = str => { let h = 2166136261; for(let k = 0; k < str.length; k++){ h ^= str.charCodeAt(k); h = Math.imul(h, 16777619); } return h >>> 0; };
    const constel = c => {
      const n = c.lessons.length, W = 240, H = 84, seed = hash(c.id);
      const rnd = k => { const x = Math.sin(seed % 997 + k * 12.9898) * 43758.5453; return x - Math.floor(x); };
      const nextI = c.lessons.findIndex(l => !l.done);
      const pts = c.lessons.map((_, k) => n === 1 ? [W/2, H/2] : [18 + k * (W - 36) / (n - 1), 42 + Math.sin(k * 1.55 + seed % 7) * 20 + (rnd(k) - .5) * 14]);
      let g = "";
      for(let k = 0; k < 14; k++) g += `<circle class="bg" cx="${(rnd(k + 40) * W).toFixed(1)}" cy="${(rnd(k + 70) * H).toFixed(1)}" r="${(.5 + rnd(k + 9) * .9).toFixed(1)}"/>`;
      for(let k = 0; k < n - 1; k++){
        const [x1, y1] = pts[k], [x2, y2] = pts[k + 1], len = Math.hypot(x2 - x1, y2 - y1).toFixed(0);
        g += `<line class="${c.lessons[k].done && c.lessons[k+1].done ? "lit" : ""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="--len:${len};--d:${k * 90}ms"/>`;
      }
      pts.forEach(([x, y], k) => {
        const L = c.lessons[k], d = `style="--d:${k * 90 + 120}ms"`;
        if(L.done) g += `<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" ${d}/>`;
        g += `<circle class="st ${L.done ? "done" : k === nextI ? "next" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${n === 1 ? 6.5 : L.done ? 4.6 : 3.8}" ${d}/>`;
      });
      return `<svg class="cn" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g}</svg>`;
    };
    const todayS = dayStr(new Date()), tx = S.todayDate === todayS ? S.todayXp : 0, gpct = Math.min(100, Math.round(tx / S.goal * 100)), lvl = levelOf(S.xp);
    const week = [...Array(7)].map((_, k) => { const d = new Date(); d.setDate(d.getDate() - 6 + k); return {l: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()], on: S.days.includes(dayStr(d)), today: k === 6}; });
    const realC = store.courses.filter(c => !c.daily);

          <div class="tinfo"><p class="lvl">Level ${lvl} · ${levelTitle(lvl)}</p><i class="lvbar"><u style="width:${S.xp % 100}%"></u></i><p class="gl">${tx >= S.goal ? "Daily goal reached. Nice work." : (S.goal - tx) + " XP to today's goal"}</p></div>

    $("#askForm").onsubmit = e => {

  }

  // Only when the person says "yes or no" in their question: a direct answer, no course and no XP.
  const isYesNo = t => /\b(?:yes\s*(?:\/|or|\|)\s*no|y\s*\/\s*n)\b/i.test(t) && !isPractice(t);
  async function answerYesNo(q, level){
    const form = $("#askForm"), old = $("#ynBox"); if(old) old.remove();
    const box = document.createElement("div"); box.id = "ynBox"; box.className = "note"; box.style.marginTop = ".9rem";

${voice(level)}
Return ONLY JSON, no markdown fences: {"answer": "Yes" or "No" or "It depends", "why": "one or two short sentences explaining the answer"}
Use "It depends" only if a plain yes or no would be misleading or the facts are genuinely disputed. If the question is not really a yes/no question, answer "It depends" and say what it needs.`, {modelTier:"quick"});
      const ans = /^no/i.test(res.answer) ? "No" : /^yes/i.test(res.answer) ? "Yes" : "It depends";
      box.className = "yn"; box.innerHTML = `<small>Quick answer · no XP</small><b class="ynA"></b><p class="ynW"></p><div class="row" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem"><button class="btn" id="ynTeach" type="button">Teach me this</button><button class="btn ghost" id="ynClose" type="button">Done</button></div>`;
      box.querySelector(".ynA").textContent = ans; box.querySelector(".ynW").textContent = String(res.why || "");

  }

  const isPractice = t => /^\s*(?:please\s+|let'?s\s+|can (?:i|you)\s+|i (?:want|need|would like) to\s+)?(?:practi[cs]e|drill|revise|quiz me|test me|test my)\b/i.test(t) || /\b(?:quiz me|test me|mock test|practi[cs]e (?:questions|problems|test|quiz))\b/i.test(t);
  const practiceTopic = t => (t.replace(/^\s*(?:please\s+|let'?s\s+|can (?:i|you)\s+|i (?:want|need|would like) to\s+)?(?:practi[cs]e|drill|revise|quiz me|test me|test my knowledge|test my)\s*(?:me\s*)?(?:on|with|in|about|of|for)?\s*/i, "").trim() || t).slice(0,120);
  function createPractice(topic, level){
    const t = practiceTopic(topic);
    const c = {
      id: "c" + Date.now().toString(36), topic: t, level, mode: "practice",
      title: ("Practice: " + t).slice(0,70),

  async function buildCourse(topic, level){
    if(!topic || !sample) return;
    if(isPractice(topic)) return createPractice(topic, level);
    const btn = $("#goBtn"); btn.disabled = true; btn.textContent = "Mapping your course…";
    try{
      const res = await sample.json(
`You are the course designer for EduVerse, an app where people learn anything.
Design a short learning path on: "${topic}"
${voiceM(level)}
Return ONLY JSON, no markdown fences:
{"title": "clear course title (max 8 words)", "tagline": "one sentence on what the learner will be able to do afterwards", "lessons": [{"title": "lesson title (max 7 words)", "goal": "one sentence on what this lesson covers"}]}
If the request is only asking for the meaning or definition of a word, term or phrase (for example "meaning of X", "what does X mean", "define X"), return EXACTLY ONE lesson that covers the meaning, origin or key ideas, examples and common confusions. ${isKid(level) ? "This learner is a small child: make the course only 2-3 very small lessons, each about one single idea. " : ""}Otherwise choose the number of lessons that genuinely fits the topic: a narrow, simple topic needs only 2-4 lessons; a medium topic 5-7; a broad subject (a whole field, a language, a programming language) 8-12. Do not default to 7. Lessons build on each other, from absolute foundations to application. Every lesson must teach exactly ONE small, concrete skill or idea that can be learned in about 5 minutes (for a language or programming course: one concept per lesson, such as "printing text" or "variables", never "basics" in general). Order lessons by what must be understood first, and never use a term in an early lesson that is only explained later. Assume ${isKid(level) ? "the child knows nothing" : level === "Beginner" ? "the learner knows nothing about this topic" : "the learner has the basics already"}.
If the topic is unsafe to teach, make a course on the nearest safe, educational angle instead.`, {modelTier:"default", cache:true});
      if(!res || !Array.isArray(res.lessons) || !res.lessons.length) throw {message:"the course came back empty"};
      const c = {
        id: "c" + Date.now().toString(36),
        topic, level,
        title: String(res.title || topic),
        tagline: String(res.tagline || ""),
        lessons: res.lessons.slice(0,14).map(l => ({title:String(l.title||"Lesson"), goal:String(l.goal||"")}))
      };
      store.courses.unshift(c); save();
      go({name:"course", id:c.id});
    }catch(e){ renderHome(errText(e)); $("#topic").value = topic; }
  }

  // ---------- course ----------
  function sky(c){
    const n = c.lessons.length, W = 640, H = 200, pad = 40;
    const pts = c.lessons.map((_,i) => {
      const x = pad + (W-2*pad) * (n===1 ? .5 : i/(n-1));
      const wobble = [0.62,0.28,0.55,0.18,0.48,0.3,0.7,0.4][i%8];
      return [x, 20 + wobble*(H-60)];
    });
    const next = c.lessons.findIndex(l => !l.done);
    let s = `<svg class="sky" viewBox="0 0 ${W} ${H}" role="img" aria-label="Course map: ${c.lessons.filter(l=>l.done).length} of ${n} lessons complete">`;
    for(let i=0;i<n-1;i++){
      const lit = c.lessons[i].done && c.lessons[i+1].done;
      s += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}" class="${lit?"lit":""}"/>`;
    }
    pts.forEach(([x,y],i) => {
      if(i===next) s += `<circle class="halo twinkle" cx="${x}" cy="${y}" r="16"/>`;
      s += `<circle class="s ${c.lessons[i].done?"done":""}" cx="${x}" cy="${y}" r="${c.lessons[i].done?9:7}" tabindex="0" role="button" style="animation-delay:${i*55}ms" data-star="${i}" aria-label="Lesson ${i+1}: ${esc(c.lessons[i].title)}"><title>${esc(c.lessons[i].title)}</title></circle>`;
      s += `<text x="${x}" y="${y+28}" text-anchor="middle">${i+1}</text>`;
    });
    return s + `</svg>`;
  }
  function renderCourse(c){

        ${c.mode === "practice" ? "" : `<button class="btn ghost" id="cfeed" type="button" style="margin:0 .5rem .6rem 0">Drift through this course</button>`}<button class="btn" id="cont">${c.mode === "practice" ? (done ? "Open results" : "Start practice") : next===-1 ? "Review lesson 1" : done ? "Continue with lesson "+(next+1) : "Start lesson 1"}</button>

      <div class="nav-row"><span></span><button class="link" id="del">Delete this course</button></div>`;
    $("#back").onclick = () => go({name:"home"});
    { const an = $("#another"); if(an) an.onclick = () => go({name:"home"}); }

    { const pl = $("#cplace"); if(pl) pl.onclick = () => sample ? placement(c) : toast("Open EduVerse inside Claude to use this"); }
    { const f = $("#cfeed"); if(f) f.onclick = () => sample ? openFeed({course:c}) : toast("Open EduVerse inside Claude to use this"); }
    $("#cont").onclick = () => go({name:"lesson", id:c.id, i: next===-1?0:next});
    app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => go({name:"lesson", id:c.id, i:+b.dataset.l}));

    $("#del").onclick = () => {
      const row = $("#del").closest(".nav-row");
      row.innerHTML = `<span></span><div class="askdel" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><span id="delq"></span><button class="btn danger" id="yes" type="button">Delete course</button><button class="btn ghost" id="no" type="button">Keep</button></div>`;
      $("#delq").textContent = `Delete "${c.title}" and its progress?`;

      $("#no").focus();

  // ---------- listen ----------
  const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  let ttsTok = 0;
  function stopSpeech(){ ttsTok++; try{ if(scrLock){ scrLock.release(); scrLock = null; } }catch(e){} try{ if(typeof keep !== "undefined" && keep) keep.pause(); }catch(e){} if(TTS){ try{ speechSynthesis.cancel(); speechSynthesis.resume(); }catch(e){} } }
  window.addEventListener("pagehide", stopSpeech);
  function spokenText(node){
    const b = node || $("#body"); if(!b) return "";
    const n = b.cloneNode(true);
    n.querySelectorAll("svg,.widget,figure,pre,button,.note").forEach(x => x.remove());
    n.querySelectorAll("math,.katex").forEach(x => x.replaceWith(" the formula shown "));
    n.querySelectorAll("h2,h3,li,p").forEach(x => x.append(". ZZPARA. "));
    n.querySelectorAll("strong,b,em").forEach(x => { x.prepend(" ZZEMS "); x.append(" ZZEME "); });
    n.querySelectorAll("div,td,th,.fl,.tl b,.tl span").forEach(x => x.append(" "));
    const say = {"→":" to ","->":" to ","=":" equals ","+":" plus ","×":" times ","÷":" divided by ","%":" percent ","°":" degrees ","≈":" about ","≠":" not equal to ","<":" less than ",">":" greater than ","&":" and ","/":" or ","−":" minus ","–":" to ","—":", "};
    let t = n.textContent.replace(/->|[→=+×÷%°≈≠<>&\/−–—]/g, m => say[m] || " ");
    t = t.replace(/[^\p{L}\p{N}\s.,;:!?'"()-]/gu, " ").replace(/[()]/g, ",").replace(/[-_]{2,}/g," ");
    return t.replace(/\s+/g," ").replace(/\s+([.,;:!?])/g,"$1").replace(/,\s*,+/g,",").replace(/\.\s*\.+/g,".").replace(/([:;,])\s*\./g,"$1").replace(/\.?\s*ZZPARA\.?/g," \u00b6 ").replace(/ZZEMS/g," \u2039 ").replace(/ZZEME/g," \u203a ").replace(/(\u00b6\s*)+/g,"\u00b6 ").trim();
  }
  // one voice list for both the lesson player and Settings
  const voiceScore = v => {
    const n = v.name.toLowerCase(); let k = 0;
    if(/natural|neural|online/.test(n)) k += 6;

    if(/google/.test(n)) k += 3;
    if(/samantha|karen|daniel|moira|serena|ava|allison|aria|jenny|guy|libby|ryan|sonia|neerja|prabhat|veena|rishi|lekha/.test(n)) k += 2;

  function voiceChoices(){

  const b64u = bytes => { let s = ""; for(let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

  function wrapLines(ctx, text, maxW){
    const words = String(text).split(/\s+/), lines = []; let cur = "";
    words.forEach(w => { const t = cur ? cur + " " + w : w; if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
    if(cur) lines.push(cur); return lines;
  }
  let logoImg = null;
  const loadLogo = () => logoImg ? Promise.resolve(logoImg) : new Promise(r => { const i = new Image(); i.onload = () => { logoImg = i; r(i); }; i.onerror = () => r(null); i.src = LOGO; });
  async function bragCard(o){
    const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const x = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
    const a1 = (cs.getPropertyValue("--a1") || "#3D8BFF").trim() || "#3D8BFF", ff = getComputedStyle(document.body).fontFamily || "system-ui, sans-serif";
    const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#0B1020"); g.addColorStop(1, "#1A1240"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W * .75, H * .25, 40, W * .75, H * .25, 900); glow.addColorStop(0, a1); glow.addColorStop(1, "rgba(0,0,0,0)");
    x.globalAlpha = .45; x.fillStyle = glow; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    x.textAlign = "center"; x.fillStyle = "#fff";
    x.font = `200px ${ff}`; x.fillText(o.emoji || "⭐", W / 2, 560);
    x.font = `800 46px ${ff}`; x.fillStyle = a1; x.fillText(String(o.kicker || "").toUpperCase(), W / 2, 700);
    x.fillStyle = "#fff"; x.font = `900 ${String(o.big).length > 5 ? 190 : 260}px ${ff}`; x.fillText(String(o.big), W / 2, 960);
    x.font = `700 58px ${ff}`; x.fillStyle = "rgba(255,255,255,.85)"; x.fillText(o.unit || "", W / 2, 1060);
    x.font = `600 56px ${ff}`; x.fillStyle = "#fff";
    wrapLines(x, o.line || "", W - 200).slice(0, 3).forEach((l, k) => x.fillText(l, W / 2, 1220 + k * 74));
    if(o.sub){ x.font = `500 42px ${ff}`; x.fillStyle = "rgba(255,255,255,.7)"; wrapLines(x, o.sub, W - 220).slice(0, 2).forEach((l, k) => x.fillText(l, W / 2, 1480 + k * 56)); }
    if(o.code){ x.font = `800 44px ${ff}`; x.fillStyle = a1; x.fillText("Beat me: code " + o.code, W / 2, 1640); }
    const lg = await loadLogo();
    if(lg){ x.save(); x.beginPath(); x.arc(W / 2 - 170, 1790, 46, 0, Math.PI * 2); x.clip(); x.drawImage(lg, W / 2 - 216, 1744, 92, 92 * lg.height / lg.width); x.restore(); }
    x.textAlign = "left"; x.fillStyle = "#fff"; x.font = `900 54px ${ff}`; x.fillText("EduVerse", W / 2 - 104, 1790);
    x.font = `500 34px ${ff}`; x.fillStyle = "rgba(255,255,255,.7)"; x.fillText("Learn anything", W / 2 - 104, 1832);
    return new Promise(r => cv.toBlob(b => r(b), "image/png"));
  }

    async join(code){

      const found = await dbH.collection("lg").where("codes", "array-contains", code).limit(1).get();
      if(!found.docs.length) throw {message: "No league with that code."};

      const sn = await LG.ref().get(), d = sn.exists ? sn.data() : {}; const codes = (d.codes || []).slice(), names = Object.assign({}, d.names);
      if(!codes.includes(code)){ if(codes.length >= 5) throw {message: "You can be in up to 5 leagues."}; codes.push(code); names[code] = name; await LG.save(codes, names); }
      return {code, name};

    try{
      if(localStorage.getItem("eduverse.migrated")) return;

      const keys = Object.keys(localStorage);
      const guest = load(GUEST_KEY), ids = new Set(guest.courses.map(c => c.id));
      let changed = false;
      keys.filter(k => k.startsWith("eduverse.u.")).forEach(k => { const st = load(k); st.courses.forEach(c => { if(c && c.id && !ids.has(c.id)){ guest.courses.push(c); ids.add(c.id); changed = true; } }); });
      if(changed) localStorage.setItem(GUEST_KEY, JSON.stringify(guest));
      const g = loadS("eduverse.settings");
      let best = g ? g.s : null;
      keys.filter(k => k.startsWith("eduverse.settings.")).forEach(k => { const s = loadS(k); if(s && (!best || s.s.xp > best.xp)) best = s.s; });
      if(best && (!g || best !== g.s)) localStorage.setItem("eduverse.settings", JSON.stringify(Object.assign({}, best, {_at: Date.now()})));
    }catch(e){}

  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  async function genPractice(c, note){
    const kid = isKid(c.level), total = c.total || (kid ? 10 : 20), all = [];
    for(let b = 0; all.length < total && b < 4; b++){
      const want = Math.min(10, total - all.length);
      if(note) note.textContent = `Writing your questions… ${all.length} of ${total}`;
      const res = await sample.json(
`Write ${want} multiple-choice practice questions on: "${c.topic}".
${voiceM(c.level)}
${b === 0 ? "Start easy and get gradually harder." : "Make these medium to hard, and different from the earlier ones."}
Cover different sub-topics, test understanding and application rather than trivia. ${kid ? "Each question at most 10 words, exactly 3 very short options that start with an emoji." : "Exactly 4 plausible options."} Give a one-sentence explanation of the right answer.
${all.length ? "Do NOT repeat these questions: " + all.map(x => x.q).join(" | ").slice(0,3000) : ""}
Return ONLY JSON: {"questions":[{"q":"question","options":["A","B","C","D"],"answer":0,"why":"explanation"}]}
"answer" is the 0-based index of the correct option. Inside JSON strings, escape every backslash (write \\\\frac for \\frac).`, {modelTier:"quick", cache:false});
      (res && Array.isArray(res.questions) ? res.questions : []).forEach(x => {
        if(!x || !Array.isArray(x.options) || x.options.length < 2 || !Number.isInteger(+x.answer) || +x.answer < 0 || +x.answer >= x.options.length) return;
        const opts = x.options.map((o,k) => ({t: String(o), ok: k === +x.answer}));
        shuffle(opts);
        all.push({q: String(x.q), options: opts.map(o => o.t), answer: opts.findIndex(o => o.ok), why: String(x.why || "")});
      });
    }
    if(all.length < 5) throw {message:"not enough questions came back"};
    return all.slice(0, total);
  }

  function drawPractice(c, i){

      if(j !== q.answer) opts[j].classList.add("wrong");
      const w = box.querySelector(".why"); w.hidden = false; w.className = "why " + (j === q.answer ? "ok" : "bad"); w.innerHTML = `<b>${j === q.answer ? "Correct!" : "Not quite."}</b> ` + mi(q.why);
      $("#pnext").hidden = false; $("#pnext").focus({preventScroll:true});

    if(picked !== undefined) reveal(picked);
    opts.forEach(o => o.onclick = () => { const j = +o.dataset.j; P.picks[P.idx] = j; save(); reveal(j); const r = runOf(); if(j === q.answer && [3,5,10,15].includes(r)){ toast("Combo ×" + r + " — keep going", "big"); burst(); setTimeout(SFX.combo, 250); } });
    $("#pnext").onclick = () => { P.idx++; save(); drawPractice(c, i); window.scrollTo(0, 0); };

  function drawPracticeResults(c, i){

    const wrong = P.qs.map((q,k) => ({q, k, pick: P.picks[k]})).filter(x => x.pick !== x.q.answer);

    const res = await sample.json(
`You are writing a quick skill check so a learner can skip what they already know.
Course: "${c.title}" (topic: ${c.topic}). ${voiceM(c.level)}
Lessons to check:
${list}
For EACH lesson above write exactly ${per} multiple-choice question${per > 1 ? "s" : ""} that someone who truly knows that lesson's skill answers correctly, but someone who does not would likely get wrong. Real understanding, not trivia; never trick questions; 3 or 4 options where the wrong options are common mistakes. ${/program|code|python|javascript|java\b|html|css|sql|c\+\+/i.test(c.topic + " " + c.title) ? "For programming, prefer 'what will this print?' with the code in the \"code\" field." : ""} Use only ideas from that lesson and the lessons before it.

        $("#spNext").onclick = () => go(last ? {name:"course", id:c.id} : {name:"lesson", id:c.id, i:i + 1});
        if(last && !c.daily){
          const sb = document.createElement("button"); sb.type = "button"; sb.className = "link soc-share"; sb.id = "spShare";
          const kid = ageYears() != null && !isTeen();
          sb.textContent = kid ? "Grown-ups: share this" : "📸 Share that you finished it";
          const totalStars = c.lessons.reduce((n, l) => n + (l.stars || 0), 0);
          sb.onclick = async () => {
            if(kid){ if(await grownGate()){ const who = S.kidName || "My child"; shareCard({emoji: "🎓", kicker: "Course complete", big: String(c.lessons.length), unit: "lessons", line: who + " finished " + c.title, sub: totalStars + " stars earned"}, who + " just finished \"" + c.title + "\" on EduVerse!"); } return; }
            teenCard({emoji: "🎓", kicker: "Course complete", big: String(c.lessons.length), unit: "lessons done", line: c.title, sub: totalStars + " stars · " + S.xp + " XP"}, "I just finished \"" + c.title + "\" on EduVerse 🎓");
          };
          const sec = body.querySelector(".sp-done"); if(sec) sec.appendChild(sb);
        }
        $("#spAgain").onclick = () => start(steps);
        vRun = null;
        voiceScreen(vt().done + " " + firstTry + "/" + quizzes + ". " + vt().doneSay, ["back", "stop", "repeat", "next"], {next: () => $("#spNext").click(), repeat: () => $("#spAgain").click(), back: () => go({name:"course", id:c.id})}, vt().doneSay);
      };
      const outHearts = () => {
        body.innerHTML = `<section class="sp-done"><div class="sp-bigheart" aria-hidden="true">♥</div><h1>Out of lives</h1><p class="sub">No worries. Let's go over it once more and you'll get it.</p><div class="sp-act"><button class="btn" id="spRe" type="button">Try again</button><button class="btn ghost" id="spLeave" type="button">Back to course</button></div></section>`;
        $("#spRe").onclick = () => start(steps); $("#spLeave").onclick = () => go({name:"course", id:c.id});
        vRun = null;
        voiceScreen(vt().out + " " + vt().outSay, ["back", "stop", "repeat", "next"], {next: () => $("#spRe").click(), repeat: () => $("#spRe").click(), back: () => $("#spLeave").click()}, vt().outSay);
      };
      const draw = () => {
        hearts$(); prog(); vCancel(); vRun = null;
        if(pos >= queue.length) return finish();
        const st = queue[pos];
        if(st.type === "teach"){
          body.innerHTML = `<section class="sp-card"><small class="sp-tag">${esc(st.title || "Learn")}</small><div class="prose sp-text">${md(st.text)}</div>${st.alt ? `<div class="sp-alt prose">${md(st.alt)}</div>` : ""}${sample ? `<button class="link sp-conf" id="spConf" type="button">${st.alt ? "Still confusing? Try again" : "I'm confused"}</button>` : ""}${sample && pos === 0 && !L.done ? `<div class="sp-skip"><b>Already know this?</b><button class="btn ghost" id="spTest" type="button">Take a quick test</button></div>` : ""}</section><div class="sp-bar"><button class="btn" id="spGo" type="button">Got it</button></div>`;
          $("#spGo").onclick = () => { pos++; draw(); window.scrollTo(0, 0); };
          addCardListen(body.querySelector(".sp-card"), () => { const n = document.createElement("div"); n.innerHTML = "<p>" + esc(st.title || "") + ".</p>" + body.querySelector(".sp-text").innerHTML + (st.alt ? body.querySelector(".sp-alt").innerHTML : ""); if(/```/.test(st.text)) n.innerHTML += "<p>Look at the code on the screen.</p>"; return n; }, kid);
          const tb = $("#spTest"); if(tb) tb.onclick = () => testOutLesson(c, i);
          vStart(() => voiceTeach(st));
          const cb = $("#spConf"); if(cb) cb.onclick = async () => {
            cb.disabled = true; cb.textContent = "Thinking…";
            try{
              const r = await sample(`A learner finds this lesson card confusing. Explain it a completely different way in at most ${kid ? 25 : 50} words: a fresh everyday analogy first, then one tiny example. Plain words, no jargon.${/```|\bprint\b/.test(st.text) ? " If code is involved, show the smallest possible example in a fenced code block." : ""}\n${voiceM(c.level)}\nCourse: ${c.title}. Lesson: ${L.title}.\nCard:\n${st.text}`, {cache:false, modelTier:"quick"});
              if(dead) return; st.alt = String(r.text || "").trim(); draw();
            }catch(e){ cb.disabled = false; cb.textContent = "I'm confused"; toast(errText(e)); }
          };
        } else {
          const done = {v:false};
          body.innerHTML = `<section class="sp-card">${st.retry ? `<small class="sp-tag">Try again</small>` : `<small class="sp-tag">Check yourself</small>`}${st.code ? `<div class="sp-code">${md("```\n" + st.code + "\n```")}</div>` : ""}<p class="pq">${mi(st.q)}</p><div class="sp-opts">${st.options.map((o, j) => `<button class="opt" data-j="${j}" type="button">${mi(o)}</button>`).join("")}</div>${st.hint ? `<button class="link sp-conf" id="spHint" type="button">Need a hint?</button><p class="sub" id="spHintT" hidden></p>` : ""}</section><div class="sp-bar" id="spBar" hidden></div>`;
          addCardListen(body.querySelector(".sp-card"), () => { const n = document.createElement("div"); n.innerHTML = (st.code ? "<p>Look at the code on the screen.</p>" : "") + "<p>" + mi(st.q) + "</p>" + st.options.map((o, j) => "<p>" + "ABCD"[j] + ". " + mi(o) + "</p>").join(""); return n; }, kid);
          const h = $("#spHint"); if(h) h.onclick = () => { const t = $("#spHintT"); t.textContent = st.hint; t.hidden = false; h.hidden = true; };
          const opts = [...body.querySelectorAll(".opt")];
          vStart(() => voiceQuiz(st, opts));
          opts.forEach(o => o.onclick = () => {
            if(done.v) return; done.v = true; const j = +o.dataset.j, ok = j === st.answer;
            opts.forEach(x => { x.disabled = true; if(+x.dataset.j === st.answer) x.classList.add("right"); });
            if(!ok) o.classList.add("wrong");
            const bar = $("#spBar"); bar.hidden = false; bar.className = "sp-bar " + (ok ? "ok" : "bad");
            if(ok){ combo++; if(!st.retry) firstTry++; if(combo === 3 || combo === 5 || combo === 8){ try{ SFX.combo(); }catch(e){} toast(combo + " in a row!"); } }
            else { combo = 0; wrongN++; if(!kid) hearts--; if(!st.retry){ const again = Object.assign({}, st, {retry:true}); queue.push(again); } hearts$(); }
            bar.innerHTML = `<div class="sp-fb"><b>${ok ? ["Correct!", "Nice!", "You got it!", "Exactly!"][Math.floor(Math.random() * 4)] : "Not quite."}</b><span></span></div><button class="btn" id="spNx" type="button">Continue</button>`;
            bar.querySelector("span").innerHTML = mi(st.why || (ok ? "" : "Keep going, you'll see it again."));
            $("#spNx").focus({preventScroll:true});
            $("#spNx").onclick = () => { if(hearts <= 0 && !kid) return outHearts(); pos++; draw(); window.scrollTo(0, 0); };
          });
        }
      };
      draw();
    };
    if(L.steps && L.steps.length){ start(L.steps); return; }
    if(!sample){ body.innerHTML = noAI(); return; }
    const notes = ["Planning your lesson…", "Finding the simplest way to explain it…", "Writing the questions…", "Almost ready…"];
    let n = 0; body.innerHTML = `<section class="sp-done"><div class="qpulse" aria-hidden="true"><i></i><i></i><i></i></div><p class="wait" id="spWait">${notes[0]}</p></section>`;
    const tm = setInterval(() => { const w = $("#spWait"); if(!w){ clearInterval(tm); return; } n = Math.min(n + 1, notes.length - 1); w.textContent = notes[n]; }, 6000);
    const prevCleanup = viewCleanup; viewCleanup = () => { clearInterval(tm); if(prevCleanup) prevCleanup(); };
    genSteps(c, i).then(steps => { clearInterval(tm); if(dead) return; L.steps = steps; save(); start(steps); })
      .catch(e => { clearInterval(tm); if(dead) return; body.innerHTML = `<section class="sp-done"><div class="note">${esc(errText(e))}</div><div class="sp-act"><button class="btn" id="spRetry" type="button">Try again</button><button class="btn ghost" id="spLeave2" type="button">Back to course</button></div></section>`; $("#spRetry").onclick = () => renderSteps(c, i); $("#spLeave2").onclick = () => go({name:"course", id:c.id}); });
  }

  function setMeta(c, i){
    const m = $("#lmeta"), L = c.lessons[i]; if(!m) return;
    m.textContent = "Lesson " + (i+1) + " of " + c.lessons.length + (L.content ? " · " + readMins(L.content) + " min read" : "");
  }
  async function refine(c, i, kind){
    const L = c.lessons[i]; if(!sample || !L.content) return;
    const spec = {
      simpler: ["Explained simply", "Re-explain the key ideas of this lesson in much simpler words, with one friendly everyday analogy. 120-180 words."],
      deeper: ["Going deeper", "Add a deeper section for a curious learner: the underlying mechanism or reasoning, one common misconception, and a short worked example. 200-300 words."],
      example: ["Another example", "Give one fresh, concrete worked example that was NOT in the lesson, step by step. 120-200 words."]
    }[kind];
    const btns = app.querySelectorAll("[data-ref]"); btns.forEach(b => { b.disabled = true; });
    const b0 = app.querySelector('[data-ref="' + kind + '"]'), old = b0.textContent; b0.textContent = "Writing…";
    try{
      const r = await sample(`You are a warm teacher on EduVerse. Course "${c.title}", lesson "${L.title}".
${voiceM(c.level)}${VISUALS}
Lesson so far:
---
${L.content.slice(0,5000)}
---
${spec[1]}
Reply in Markdown that starts with the heading "## ${spec[0]}" and has nothing before it.`, {modelTier:"default", cache:false});
      let t = (r.text || "").trim(); if(!/^##\s/.test(t)) t = "## " + spec[0] + "\n\n" + t;
      const k = L.content.search(/\n## (Key takeaways|Big words)/);
      L.content = k > 0 ? L.content.slice(0,k) + "\n\n" + t + "\n" + L.content.slice(k) : L.content + "\n\n" + t;
      save();
      const body = $("#body"); if(body) body.innerHTML = md(L.content);
      setMeta(c,i);
      toast("Added to your lesson");
    }catch(e){ toast(errText(e)); }
    btns.forEach(b => { b.disabled = false; }); b0.textContent = old;
  }
  function hasVisual(t){ return /```svg|\[\[[a-z-]+/i.test(t || ""); }
  async function addVisual(c, i, quiet){
    const L = c.lessons[i], body = $("#body"); if(!sample || !L.content) return;
    const b = $("#vBtn"); if(b){ b.disabled = true; b.textContent = "Drawing…"; }
    try{
      const r = await sample(`You are drawing ONE picture to help a learner understand a lesson.
Lesson: "${L.title}" in the course "${c.title}".
${isKid(c.level) ? "The learner is a 5-year-old: make it very simple, big, friendly, with few short labels." : ""}
Lesson text:
---
${L.content.slice(0,4000)}
---
${VISUALS}
Reply with ONLY the visual and nothing else: either a single built-in [[...]] line, or a single \`\`\`svg fenced block. It must show the main idea of this lesson.`, {modelTier:"default", cache:false});
      const out = (r.text || "").trim();
      if(!hasVisual(out)) throw {message:"no picture came back"};
      const parts = L.content.split(/\n(?=## )/);
      if(parts.length > 2){ parts.splice(2, 0, out); L.content = parts.join("\n\n").replace(/\n\n\n+/g,"\n\n"); }
      else L.content = L.content + "\n\n" + out;
      save();
      if(b && b.parentNode) b.parentNode.remove();
      if(view && view.name === "lesson" && body && document.body.contains(body)){ body.innerHTML = md(L.content); }
    }catch(e){
      if(b){ b.disabled = false; b.textContent = "Add a diagram"; }
      if(!quiet) body.insertAdjacentHTML("beforeend", `<div class="note">${esc(errText(e))}</div>`);
    }
  }

  async function generateLesson(c, i){
    const L = c.lessons[i], body = $("#body");
    body.innerHTML = `<p class="wait">Writing your lesson…</p>`;
    const ctl = new AbortController(); busy = ctl;
    const outline = c.lessons.map((l,k)=>`${k+1}. ${l.title}${k===i?"  <-- this lesson":""}`).join("\n");
    try{
      const r = await sample(
`You are a warm, clear teacher on EduVerse.
Course: "${c.title}" (topic: ${c.topic}).
${voiceM(c.level)}${VISUALS}
Course outline:
${outline}

Write lesson ${i+1}: "${L.title}" — ${L.goal}
Format in Markdown:
- Open with 1-2 sentences on why this matters (no heading for this part).
- 2 to 4 sections with "## " headings that teach the ideas step by step.
- Include at least one concrete example and one everyday analogy. Use code blocks only if the topic is programming. Include at least one diagram (SVG) whenever the topic has a process, structure, cycle, comparison or anything spatial.
- End with "## Key takeaways" as 3-5 bullet points.
${isKid(c.level) ? "Keep it SHORT: 120-200 words total, as a tiny story. At most 3 short sections, each heading starting with an emoji. End with a \"## Big words\" section listing the 2-3 real terms, each with a one-line kid meaning, then the line: Now you know it! Do not write a long Key takeaways list." : "Around 500-750 words."} Don't repeat the lesson title as a heading. Don't preview other lessons in detail.`,
        {signal: ctl.signal, modelTier:"default", onText: ({text}) => { body.innerHTML = md(text); }});
      if(busy !== ctl) return;
      busy = null;
      L.content = r.text; save();
      body.innerHTML = md(L.content);
      setMeta(c,i);
      renderAfter(c,i);
      if(S.autoDiagram && !hasVisual(L.content)) addVisual(c,i,true);
    }catch(e){
      if(busy !== ctl) return;
      busy = null;
      if(e && e.text){ body.innerHTML = md(e.text); }
      body.insertAdjacentHTML("beforeend", `<div class="note">${esc(errText(e))} <button class="link" id="retry">Try again</button></div>`);
      const rb = $("#retry"); if(rb) rb.onclick = () => generateLesson(c,i);
    }
  }

  function renderAfter(c, i){
    const L = c.lessons[i], last = i === c.lessons.length-1;
    $("#after").innerHTML = `
      ${sample ? `<div class="tools" aria-label="Change this lesson">
        <button class="btn ghost" type="button" data-ref="simpler">Simpler</button>
        <button class="btn ghost" type="button" data-ref="deeper">Go deeper</button>
        <button class="btn ghost" type="button" data-ref="example">Another example</button>
        ${hasVisual(L.content) ? "" : `<button class="btn ghost" id="vBtn" type="button">Add a diagram</button>`}
      </div>` : ""}
      <section class="panel" id="quizBox">
        <h2>Check your understanding</h2>
        <div id="quiz">${L.quizPassed ? `<p style="margin:0 0 1rem">Passed: you got ${L.quizScore} of ${L.quizTotal}.</p>` : (L.quizTotal ? `<p style="margin:0 0 1rem">Last try: ${L.quizScore} of ${L.quizTotal}. You need ${need(L.quizTotal)} to pass.</p>` : "")}${sample ? `<p style="margin:0 0 1rem;color:var(--muted)">${L.quizPassed ? "Want to practise again?" : `Score at least ${S.pass}% to unlock the next lesson. Each retry has new questions.`}</p><button class="btn ${L.quizPassed?"ghost":""}" id="qBtn">${L.quizPassed ? "Retake quiz" : (L.quizTotal ? "Try again" : "Take the quiz")}</button>` : `<p class="empty">Quizzes need Claude.</p>`}</div>
      </section>
      <section class="panel">
        <h2>Ask your tutor</h2>
        ${sample ? `<div class="tchips" id="tChips">${["Explain it simpler","Give me an example","Why does this matter?","Quiz me with one question"].map(q => `<button type="button" data-tq="${q}">${q}</button>`).join("")}</div>` : ""}
        <div class="chat" id="chat"></div>
        ${L.chat.length ? `<p style="margin:0 0 .75rem"><button class="link" id="clearChat" type="button">Clear chat</button></p>` : ""}
        <form class="chat-form" id="chatForm">
          <label for="qIn" style="position:absolute;left:-9999px">Your question</label>
          <input id="qIn" placeholder="Anything unclear? Ask here" autocomplete="off" ${sample?"":"disabled"}>
          <button class="btn" type="submit" ${sample?"":"disabled"}>Ask</button>
        </form>
      </section>
      <div class="nav-row">
        ${i>0 ? `<button class="btn ghost" id="prev">Previous lesson</button>` : `<span></span>`}
        <button class="btn" id="next" ${unlocked(L)?"":"disabled"}>${nextLabel(L,last)}</button>
      </div>
      <p id="lockNote" style="margin:.5rem 0 0;color:var(--muted);font-size:.95rem;text-align:right" ${unlocked(L)?"hidden":""}>Pass the quiz (at least ${S.pass}%) to continue.</p>
      ${L.content ? `<p style="margin-top:1rem"><button class="link" id="regen">Rewrite this lesson</button></p>` : ""}`;
    drawChat(L);
    const qb = $("#qBtn"); if(qb) qb.onclick = () => runQuiz(c,i);
    const vb = $("#vBtn"); if(vb) vb.onclick = () => addVisual(c,i,false);
    app.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => refine(c,i,b.dataset.ref));
    app.querySelectorAll("[data-tq]").forEach(b => b.onclick = () => { $("#qIn").value = b.dataset.tq; ask(c,i); });
    { const cc = $("#clearChat"); if(cc) cc.onclick = () => { L.chat = []; save(); renderAfter(c,i); }; }
    const pv = $("#prev"); if(pv) pv.onclick = () => go({name:"lesson", id:c.id, i:i-1});
    $("#next").onclick = () => {
      if(!unlocked(L)) return;
      const first = !L.done;
      L.done = true; save();
      if(first) award(last ? 70 : 20, last ? "Course complete" : "Lesson complete", {course: last});
      go(last ? {name:"course", id:c.id} : {name:"lesson", id:c.id, i:i+1});
    };
    const rg = $("#regen"); if(rg && sample) rg.onclick = () => { L.content = null; L.chat = []; L.quizPassed = false; L.quizTotal = 0; save(); renderLesson(c,i); }; else if(rg) rg.remove();
    $("#chatForm").onsubmit = e => { e.preventDefault(); ask(c,i); };
  }

  const need = n => n <= 3 ? Math.max(1, Math.round(n*S.pass/100)) : Math.ceil(n*S.pass/100);
  function unlocked(L){ return !!(L.done || L.quizPassed); }
  function nextLabel(L,last){ return L.done ? (last ? "Back to course" : "Next lesson") : (last ? "Finish course" : "Complete and continue"); }

  function drawChat(L, anim){
    const el = $("#chat");
    el.innerHTML = L.chat.map(m => m.role==="user"
      ? `<div class="msg me">${esc(m.content)}</div>`
      : `<div class="msg ai prose">${md(m.content)}</div>`).join("");
    if(anim && el.lastElementChild) el.lastElementChild.classList.add("new");
  }

  async function ask(c, i){
    const L = c.lessons[i], input = $("#qIn"), q = input.value.trim();
    if(!q || !sample) return;
    input.value = ""; input.disabled = true;
    L.chat.push({role:"user", content:q});
    drawChat(L, true);
    const bubble = document.createElement("div");
    bubble.className = "msg ai prose new"; bubble.innerHTML = `<p class="wait">Thinking…</p>`;
    $("#chat").appendChild(bubble);
    const ctx = `You are a patient tutor on EduVerse. The learner is studying the course "${c.title}", lesson "${L.title}".
Here is the lesson they just read:
---
${(L.content||"").slice(0,6000)}
---
${voiceM(c.level)} You may include a small SVG diagram when it truly helps, using the same rules:${VISUALS}\nAnswer their questions clearly and concisely (${isKid(c.level) ? "in at most 3 very short sentences a 5-year-old gets, with one emoji" : "usually under 200 words"}), with an example when it helps. Use Markdown sparingly.`;
    const turns = [{role:"user", content: ctx + "\n\nLearner's question: " + L.chat[0].content}];
    for(let k=1;k<L.chat.length;k++) turns.push({role:L.chat[k].role, content:L.chat[k].content});
    if(isYesNo(q)) turns[turns.length-1] = {role:"user", content: turns[turns.length-1].content + "\n\n(They asked for a yes or no answer. Start your reply with exactly one word: Yes, No, or Depends, then at most one short sentence of why. Nothing more.)"};
    const ctl = new AbortController(); busy = ctl;
    try{
      const r = await sample(turns, {signal:ctl.signal, cache:false, modelTier:"default", onText: ({text}) => { bubble.innerHTML = md(text); }});
      if(busy !== ctl) return; busy = null;
      L.chat.push({role:"assistant", content:r.text}); save();
      bubble.innerHTML = md(r.text);
    }catch(e){
      if(busy !== ctl) return; busy = null;
      L.chat.pop(); save();
      bubble.innerHTML = `<p>${esc(errText(e))}</p>`;
      input.value = q;
    }
    input.disabled = false; input.focus();
  }

  async function runQuiz(c, i){
    const L = c.lessons[i], box = $("#quiz");
    box.innerHTML = `<p class="wait">Writing questions…</p>`;
    try{
      const res = await sample.json(
`Write a ${isKid(c.level) ? "3-question picture-style multiple-choice quiz for a 5-year-old: each question at most 10 words, exactly 3 very short options (start each option with an emoji), and a cheerful one-sentence why" : "5-question multiple-choice quiz"} for this lesson. ${voiceM(c.level)} Keep question wording at that level.
Lesson "${L.title}":
---
${(L.content||"").slice(0,6000)}
---
Test understanding, not trivia. Return ONLY JSON:
{"questions":[{"q":"question","options":["A","B","C","D"],"answer":0,"why":"one-sentence explanation"}]}
"answer" is the 0-based index of the correct option. Inside JSON strings, escape every backslash (write \\\\frac for \\frac).`, {modelTier:"quick", cache:false});
      const qs = (res && Array.isArray(res.questions) ? res.questions : []).filter(x => x && Array.isArray(x.options) && x.options.length>1).slice(0, isKid(c.level) ? 3 : 5);
      if(qs.length < 3) throw {message:"no questions came back"};
      let score = 0, answered = 0;
      box.innerHTML = qs.map((x,k)=>`
        <div class="q" data-q="${k}">
          <p>${k+1}. ${mi(String(x.q))}</p>
          ${x.options.map((o,j)=>`<button class="opt" data-j="${j}">${mi(String(o))}</button>`).join("")}
          <div class="why" hidden></div>
        </div>`).join("") + `<p id="score" style="margin:0;font-weight:700" aria-live="polite"></p>`;
      box.querySelectorAll(".q").forEach(qel => {
        const x = qs[+qel.dataset.q], ans = +x.answer;
        qel.querySelectorAll(".opt").forEach(b => b.onclick = () => {
          const j = +b.dataset.j;
          qel.querySelectorAll(".opt").forEach(o => { o.disabled = true; if(+o.dataset.j===ans) o.classList.add("right"); });
          if(j===ans) score++; else b.classList.add("wrong");
          const w = qel.querySelector(".why"); w.hidden = false; w.innerHTML = `<b>${j===ans ? "Correct!" : "Not quite."}</b> ` + mi(x.why||"");
          if(++answered === qs.length){
            const ok = score >= need(qs.length);
            L.quizScore = score; L.quizTotal = qs.length;
            if(ok) L.quizPassed = true;
            save();
            if(ok && !L.quizAwarded){ L.quizAwarded = true; save(); award(10 + score * 2, "Quiz passed", {quiz:true, fullMarks: score === qs.length}); }
            const sc = $("#score");
            if(ok){
              sc.textContent = `You got ${score} of ${qs.length}. Passed${L.done ? "." : ", next lesson unlocked."}`;
              const nb = $("#next"); if(nb){ nb.disabled = false; nb.classList.add("pop"); }
              const ln = $("#lockNote"); if(ln) ln.hidden = true;
            } else {
              sc.innerHTML = `You got ${score} of ${qs.length}, and you need ${need(qs.length)} to pass. Reread the lesson or ask your tutor, then try again with new questions. `;
              const again = document.createElement("button");
              again.className = "btn"; again.textContent = "Try again"; again.style.marginTop = ".75rem";
              again.onclick = () => runQuiz(c,i);
              sc.appendChild(document.createElement("br")); sc.appendChild(again);
            }
          }
        });
      });
    }catch(e){
      box.innerHTML = `<div class="note">${esc(errText(e))}</div><button class="btn ghost" id="qBtn">Try again</button>`;
      $("#qBtn").onclick = () => runQuiz(c,i);
    }
  }

  render();
})();
</script>
</body>
</html>
